<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE log4j:configuration SYSTEM "log4j.dtd">
<log4j:configuration>
    <appender name="obcDaily" class="org.apache.log4j.DailyRollingFileAppender">
    	<param name="file" value="/apps/OBC/log/obc-web.log"/>
    	<param name="datePattern" value="'.'yyyy-MM-dd"/>
        <layout class="org.apache.log4j.PatternLayout">
            <param name="ConversionPattern" value="%d{dd/MM/yyyy HH:mm:ss} - %p %c.%m%n" />
        </layout>
    </appender>
  
	<category name="com.figstreet">
		<level value="debug"/> <!-- note lowercase! -->
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="org.apache">
		<level value="info"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="org.bouncycastle">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="com.google">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="com.mchange">
        <level value="warn"/>
        <appender-ref ref="obcDaily"/>
    </category>
	<category name="com.sun.mail">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="javax.mail">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="org.jdom2">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="net.htmlparser">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="org.reflections">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
	<category name="org.h2">
		<level value="warn"/>
		<appender-ref ref="obcDaily"/>
	</category>
</log4j:configuration>
